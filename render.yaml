services:
  - type: web
    name: qr-attendance-school
    env: docker
    plan: starter
    disk:
      name: attendance-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: file:/data/dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false
